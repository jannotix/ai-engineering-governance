name: Verify governance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate JSON manifests
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool marketplace.json >/dev/null
          python -m json.tool plugins/ai-engineering-governance/.zcode-plugin/plugin.json >/dev/null
          python -m json.tool plugins/ai-engineering-governance/.mcp.json >/dev/null
          python -m json.tool plugins/ai-engineering-governance/hooks/hooks.json >/dev/null
          python -m json.tool package.json >/dev/null

      - name: Check runtime syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check plugins/ai-engineering-governance/hooks/governance-hook.js
          node --check plugins/ai-engineering-governance/runtime/mcp-server.js
          for file in plugins/ai-engineering-governance/runtime/lib/*.js tests/runtime/*.test.js; do
            node --check "$file"
          done

      - name: Run repository tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee unittest-output.txt

      - name: Run deterministic runtime tests
        shell: bash
        run: |
          set -o pipefail
          npm run test:runtime 2>&1 | tee runtime-test-output.txt

      - name: Upload verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-output-${{ matrix.os }}
          path: |
            unittest-output.txt
            runtime-test-output.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Verify repository hygiene
        shell: bash
        run: |
          set -euo pipefail

          stale_references=(
            'FILE_MANIFEST.sha256'
            '/ai-arbitrate'
            'commands/ai-arbitrate.md'
          )

          for reference in "${stale_references[@]}"; do
            if git grep -nF -- "$reference" -- ':!CHANGELOG.md' ':!tests/test_repository.py' ':!.github/workflows/verify.yml'; then
              echo "stale documentation reference: $reference" >&2
              exit 1
            fi
          done

          tracked_residue="$(git ls-files '*.tmp' '*.bak' '*.log' '*debug-output*' '*diagnostic-output*' '*windows-install-error*')"
          if [[ -n "$tracked_residue" ]]; then
            printf 'tracked temporary or diagnostic residue:\n%s\n' "$tracked_residue" >&2
            exit 1
          fi

      - name: Scan obvious secret patterns
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE 'sk-[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----'; then
            echo 'Potential plaintext secret material detected.' >&2
            exit 1
          fi
